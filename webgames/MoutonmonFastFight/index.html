<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moutonmon Fast Fight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        
        <!-- CONTRÔLES AUDIO (HAUT À DROITE) -->
        <div class="audio-controls">
            <button id="btn-music" onclick="toggleMusic()" class="btn-audio">🎵</button>
            <button id="btn-sound" onclick="toggleSound()" class="btn-audio">🔊</button>
        </div>

        <!-- ÉCRAN 1 : SÉLECTION -->
        <div id="screen-title" class="screen active">
            <h1 class="logo">MOUTONMON <span>FAST FIGHT</span></h1>
            
            <div class="selection-container">
                <p class="instruction">Composez votre équipe (Survolez pour les statistiques)</p>
                <div id="selection-grid" class="selection-grid"></div>
                
                <div class="team-preview-area">
                    <p class="preview-label">VOTRE ÉQUIPE</p>
                    <div class="team-slots">
                        <div class="slot" id="slot-0"></div>
                        <div class="slot" id="slot-1"></div>
                        <div class="slot" id="slot-2"></div>
                    </div>
                </div>
            </div>

            <div id="start-button-wrapper" class="hidden">
                <button id="btn-start-tournament" class="main-btn-mega" disabled>LANCER LE TOURNOI</button>
            </div>
        </div>

        <!-- ÉCRAN 2 : LEADER / REMPLACANT -->
        <div id="screen-order" class="screen">
            <div class="header-info">
                <h2 id="tournament-progress">Combat 1 / 11</h2>
                <div id="recovery-msg" class="recovery-text"></div>
                <p id="order-instruction">Choisissez votre prochain combattant :</p>
            </div>
            <div id="order-options" class="selection-grid small"></div>
        </div>

        <!-- ÉCRAN 3 : ARÈNE DE COMBAT -->
        <div id="screen-battle" class="screen">
            <!-- MENU CHANGEMENT -->
            <div id="switch-menu" class="hidden-overlay">
                <div class="switch-content">
                    <h3>REMPLAÇANT</h3>
                    <div id="switch-list" class="selection-grid small"></div>
                    <button onclick="closeSwitchMenu()" class="btn-style active" style="margin-top:20px; width: 120px;">RETOUR</button>
                </div>
            </div>

            <div class="battle-layout">
                <div class="arena-main">
                    <!-- ENNEMI -->
                    <div class="unit-wrapper enemy" id="wrapper-enemy">
                        <div class="unit">
                            <div id="style-notif-enemy" class="style-notif">STYLE !</div>
                            <div class="stats-card">
                                <div class="info-row">
                                    <span id="enemy-name">???</span>
                                    <span id="enemy-matchup" class="matchup-arrow"></span>
                                    <img id="enemy-type-icon" class="type-icon-ui" src="" alt="">
                                </div>
                                <div class="hp-container"><div id="enemy-hp-fill" class="hp-fill"></div></div>
                            </div>
                            <div class="sprite-box">
                                <img id="enemy-sprite" class="sprite-img" src="" alt="">
                            </div>
                        </div>
                    </div>

                    <!-- JOUEUR -->
                    <div class="unit-wrapper player" id="wrapper-player">
                        <div class="unit">
                            <div id="style-notif-player" class="style-notif">STYLE !</div>
                            <div class="sprite-box">
                                <img id="player-sprite" class="sprite-img" src="" alt="">
                            </div>
                            <div class="stats-card">
                                <div class="info-row">
                                    <span id="player-name">???</span>
                                    <span id="player-matchup" class="matchup-arrow"></span>
                                    <img id="player-type-icon" class="type-icon-ui" src="" alt="">
                                </div>
                                <div class="hp-container"><div id="player-hp-fill" class="hp-fill"></div></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="turn-order-sidebar">
                    <h3>ORDRE</h3>
                    <div id="turn-list"></div>
                </div>
            </div>

            <div id="battle-log">Préparation du combat...</div>

            <!-- PANNEAU DE CONTRÔLES -->
            <div class="controls-area">
                <div class="styles-row">
                    <button id="style-fast" class="btn-style" onclick="selectStyle('fast')">⚡ RAPIDE</button>
                    <button id="style-normal" class="btn-style active" onclick="selectStyle('normal')">⚖️ NORMAL</button>
                    <button id="style-strong" class="btn-style" onclick="selectStyle('strong')">🔥 FORT</button>
                </div>
                <div class="actions-row">
                    <button onclick="handleAction('weak')" id="btn-weak" class="btn-action">
                        <span class="label">ATTAQUE FAIBLE</span>
                        <span class="pp" id="pp-weak">PA 15</span>
                    </button>
                    <button onclick="handleAction('strong')" id="btn-strong" class="btn-action">
                        <span class="label">ATTAQUE FORTE</span>
                        <span class="pp" id="pp-strong">PA 3</span>
                    </button>
                    <button onclick="handleAction('heal')" id="btn-heal" class="btn-action btn-heal">
                        <span class="label">SOIN (75%)</span>
                        <span class="pp" id="heal-status">1/1</span>
                    </button>
                    <button onclick="openSwitchMenu()" class="btn-action btn-switch">
                        <span class="label">Changer de Moutonmon</span>
                    </button>
                    <button onclick="handleAction('dodge')" id="btn-dodge" class="btn-action dodge">
                        <span class="label">ESQUIVE</span>
                        <span class="pp" id="dodge-status">Prête</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="screen-end" class="screen">
            <h1 id="end-title">RÉSULTAT</h1>
            <p id="end-message"></p>
            <button onclick="location.reload()" class="main-btn-mega">RETOUR AU MENU</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
