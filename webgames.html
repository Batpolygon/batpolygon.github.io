<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icons/MadeByBatpolygonFavIcon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jouez aux jeux web gratuits de Batpolygon directement dans votre navigateur. Découvrez Tout Milieu HTML, Moutonmon Fast Fight et plus encore.">
    <title>Jeux Web - Made By Batpolygon</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styles spécifiques pour la fenêtre Popup (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            position: relative;
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-modal {
            position: absolute;
            top: -50px;
            right: 0;
            color: white;
            font-size: 35px;
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
        }

        .close-modal:hover {
            color: var(--accent-blue);
            transform: rotate(90deg);
        }

        .game-card.clickable {
            cursor: pointer;
        }

        /* Animation d'ouverture du modal */
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal.active .modal-content {
            animation: modalFade 0.4s ease-out;
        }

        @media (max-width: 768px) {
            .modal-content { height: 60vh; }
            .close-modal { top: -45px; right: 10px; }
        }
    </style>
</head>
<body>

    <!-- Fond interactif -->
    <canvas id="bg-canvas"></canvas>

    <header>
        <div class="logo">
            <img src="images/icons/MadeByBatpolygonColoredIcon.png" alt="Logo" class="logo-image">
            <span>Made By <strong>BATPOLYGON</strong></span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="games.html">Jeux</a></li>
                <li><a href="webgames.html" class="active">Jeux Web</a></li>
                <li><a href="projects.html">Projets</a></li>
                <li><a href="about.html">À propos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="games container">
            <h2 class="page-title">Jeux par navigateur (HTML) :</h2>
            <div class="games-grid">

                <!-- MOUTONMON FAST FIGHT -->
                <div class="game-card glass clickable" onclick="openGame('webgames/MoutonmonFastFight/index.html')">
                    <!-- On utilise un badge pour montrer que c'est du nouveau contenu web -->
                    <div class="new-banner">NOUVEAU</div>
                    <img src="images/webgameslogo/MoutonmonFastFightLogo.png" alt="Moutonmon Fast Fight">
                    <div class="game-title">Moutonmon Fast Fight</div>
                </div>

                <!-- TOUT MILIEU HTML -->
                <div class="game-card glass clickable" onclick="openGame('webgames/Tout_Milieu_HTML.html')">
                    <img src="images/webgameslogo/ToutMilieuHTMLLogo.png" alt="Tout Milieu HTML">
                    <div class="game-title">Tout Milieu HTML</div>
                </div>

            </div>
        </section>
    </main>

    <!-- FENÊTRE POPUP (MODAL) -->
    <div id="gameModal" class="modal">
        <div style="position: relative; width: 95%; max-width: 1100px;">
            <button class="close-modal" onclick="closeGame()">&times;</button>
            <div class="modal-content glass">
                <iframe id="gameFrame" src=""></iframe>
            </div>
        </div>
    </div>

    <footer class="footer-message">
        <p>Créé par Batpolygon | <a href="eula.html">EULA & Copyright</a></p>
    </footer>

    <script>
        function openGame(url) {
            const modal = document.getElementById('gameModal');
            const iframe = document.getElementById('gameFrame');
            iframe.src = url;
            modal.style.display = "flex";
            setTimeout(() => modal.classList.add('active'), 10);
            document.body.style.overflow = "hidden"; // Bloque le scroll
        }

        function closeGame() {
            const modal = document.getElementById('gameModal');
            const iframe = document.getElementById('gameFrame');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = "none";
                iframe.src = ""; // Coupe le son et le jeu
            }, 300);
            document.body.style.overflow = "auto"; // Rend le scroll
        }

        // Fermer au clic sur le fond
        window.onclick = function(event) {
            const modal = document.getElementById('gameModal');
            if (event.target == modal) {
                closeGame();
            }
        }
    </script>

    <!-- Appel au background externe -->
    <script src="background.js"></script>
</body>
</html>
